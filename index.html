<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NeoCAD</title>
  <style>
    html,body{height:100%;margin:0;background:#0a0e13;color:#d5e1ec;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px}
    #app{display:flex;flex-direction:column;height:100vh}
    header{padding:8px 14px;background:#0e141b;border-bottom:1px solid #223041;display:flex;gap:14px;align-items:center}
    header b{color:#e8a33d}
    #status{font-size:11px;color:#7a8b9b}
    #status.solved{color:#55c07a}
    #status.bad{color:#e0605c}
    canvas{display:block;width:100%;height:100%;background:#0a0e13;cursor:crosshair}
    #log{padding:6px 14px;font-size:11px;color:#7a8b9b;border-top:1px solid #223041;white-space:pre-wrap;max-height:190px;overflow-y:auto}
    #cmdrow{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid #223041;background:#0e141b}
    #cmd{flex:1;background:transparent;border:none;outline:none;color:#d5e1ec;font-family:inherit;font-size:13px}
    #cmdhint{font-size:10.5px;color:#46586a}
    #log .in{color:#46586a}
    #log .err{color:#e0605c}
    #log .out{color:#8fa7bb}
    #hovertag{position:absolute;pointer-events:none;font-family:inherit;font-size:11px;color:#e8a33d;
      background:#0e141bdd;border:1px solid #223041;padding:2px 6px;border-radius:3px;white-space:nowrap;z-index:5}
    /* The context menu, in the hover tag's family: same ground, same border,
       same corner. It is the other thing that appears at the cursor over the
       drawing, so the two ought to look like one idea. */
    #ctxmenu{position:absolute;font-family:inherit;font-size:11.5px;background:#0e141bf5;
      border:1px solid #223041;border-radius:4px;padding:3px 0;z-index:6;min-width:120px;
      box-shadow:0 6px 20px #000a;user-select:none}
    #ctxmenu .head{padding:3px 10px 5px;margin-bottom:3px;border-bottom:1px solid #223041;
      color:#7a8b9b;font-size:10.5px;white-space:nowrap}
    #ctxmenu .item{display:flex;justify-content:space-between;gap:18px;padding:3px 10px;
      color:#d5e1ec;white-space:nowrap;cursor:default}
    #ctxmenu .item .cmd{color:#46586a}
    #ctxmenu .item:hover{background:#20303f;color:#e8a33d}
    #ctxmenu .item:hover .cmd{color:#8fa7bb}
    #ctxmenu .item.off,#ctxmenu .item.off:hover{color:#46586a;background:transparent}
    #ctxmenu .why{padding:0 10px 4px;color:#7a8b9b;font-size:10px;white-space:nowrap}
    #viewwrap{position:relative;flex:1;min-height:0}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span>NEO<b>CAD</b></span>
      <span id="status">loading kernel…</span>
    </header>
    <div id="viewwrap">
      <canvas id="cv"></canvas>
      <div id="hovertag" hidden></div>
      <div id="ctxmenu" hidden></div>
    </div>
    <div id="log"></div>
    <div id="cmdrow">
      <span style="color:#e8a33d">&gt;</span>
      <input id="cmd" autocomplete="off" spellcheck="false" placeholder="a tool name, or any expression — try help()">
      <span id="cmdhint">up/down for history</span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
