<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The page never zooms, and covers the whole screen, notch and all — the
       app keeps itself clear of the notch by the safe-area insets below.
       Every build carries these: scripts/singlefile.mjs takes each
       <meta name> from here. docs/plans/pwa-pages.md. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
  <!-- iOS turns a run of digits into a phone link; a log of coordinates is
       full of them. -->
  <meta name="format-detection" content="telephone=no">
  <title>ZeroCAD</title>
  <style>
    /* The page itself never moves (docs/plans/pwa-pages.md): fixed to the
       viewport, nothing to scroll, no rubber band, so a finger on the chrome
       cannot drag the app off the screen. Every touch on the chrome may pan
       (the log scrolls) but never double-tap zoom; the canvas takes touch-
       action none below, all of every touch its own. Nothing selects or
       raises iOS's long-press callout except where there is text to take —
       the command line, the log, a field — and no grey flash on a tap. The
       pinch iOS zooms on in spite of the viewport is refused by
       src/pagelock.ts. */
    /* The interface size (src/uiscale.ts): --ui is the factor, and the sizes
       the panels' arithmetic also uses are set from src/panels.ts's Metrics
       as their own properties, so a strip here is the height its panel was
       sized for. Everything else drawn for a person to read or hit is
       multiplied by --ui below. The defaults are a mouse's 100 %, so the page
       before main.ts runs is what it always was. */
    :root{--ui:1;--title:16px;--button:20px;--gap:2px;--icon:16px;--grip:12px;--orow:22px;--target:44px}
    html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;margin:0;background:#0a0e13;color:#d5e1ec;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;
      touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    #cmd,#log,input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
    /* **The whole window, by its edges — not 100dvh.** In an iOS home-screen
       app with a black-translucent status bar, 100vh and 100dvh are the
       screen less the status bar's inset (measured from the owner's
       screenshot: the drawing ended 62 pt above the home indicator's band on
       a phone whose top inset is 62 pt — docs/plans/chrome-logo-scale.md),
       which is what left the command line short of the bottom however far it
       was dragged. A fixed box with all four edges at 0 is the viewport
       itself, which in a standalone app is the whole screen. */
    #app{position:fixed;inset:0}
    /* There is no title bar. The status — the solve's verdict, the step note
       after it — is small text beside the logo, over the drawing, inside the
       safe area. It takes no pointer events, so a drag across the corner
       reaches the canvas; only the logo does (src/statusline.ts says when it
       fades). The text is kept when it fades: only the picture goes.
       **It never lies over a pane** (docs/plans/everything-fits.md): main.ts
       holds it to the room the layout leaves it (src/panels.ts's cornerRoom)
       — the logo's row, which the defaults keep empty, short of any pane the
       viewer drags into it — and it wraps inside that, a long word broken
       rather than run out, and is cut off rather than drawn past it. */
    #corner{position:absolute;z-index:40;pointer-events:none;display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;
      font-size:calc(11px * var(--ui));line-height:1.35;max-width:calc(100% - 24px);overflow:hidden}
    #corner>span{padding:1px 5px;border-radius:3px;background:#0a0e13f0;transition:opacity .6s,display .6s;transition-behavior:allow-discrete;min-width:0;overflow-wrap:anywhere}
    #corner>span:empty{display:none}
    #status{color:#7a8b9b}
    /* Faded, and once the fade is over out of the corner's flow too: an
       invisible "ready" holding two lines cut the note after it for as long
       as the note stood (docs/plans/touch-density.md; the re-fit note on a
       Pro Max). The text stays in the element for the tests and a reader. */
    #status[data-faded]{opacity:0;display:none}
    #status.solved{color:#55c07a}
    #status.bad{color:#e0605c}
    /* The diagnosis beside the verdict: muted while it only counts what is
       free (and fading with SOLVED), red for a conflict, which stays. A
       redundancy is said in the same muted grey and stays too — it agrees
       with the rest, so it is information, never a warning
       (docs/plans/profiles-held.md). A relation it names takes a click: it
       selects it, and Delete removes it. */
    #diagnosis{color:#7a8b9b}
    #diagnosis[data-faded]{opacity:0;display:none}
    #diagnosis.conflict{color:#e0605c}
    #diagnosis.agreeing{color:#7a8b9b}
    #diagnosis .rel{pointer-events:auto;cursor:pointer;font:inherit;color:inherit;background:none;border:none;padding:0 2px;
      text-decoration:underline dotted;text-underline-offset:2px}
    #diagnosis .rel:hover{color:#e8a33d}
    /* A conflict's two parts (docs/plans/review-solver.md): the relation that
       made it, heavier and on a pill of the conflict's ink — the glyph's
       filled box, said in text — and what it cannot hold with in the quieter
       ink, the conflict's red let down toward grey. The words between them
       ("par l1 l2 — against") stay the conflict's red. */
    #diagnosis .rel.culprit{color:#0a0e13;background:#e0605c;border-radius:3px;padding:0 4px;font-weight:700;text-decoration:none}
    #diagnosis .rel.against{color:#b98a86}
    #diagnosis .rel.culprit:hover{color:#0a0e13;background:#e8a33d}
    #diagnosis .rel.against:hover{color:#e8a33d}
    /* What the last undo or redo did, beside the verdict rather than over it
       (see stepNote in main.ts). Amber, the colour of what just happened. */
    #stepnote{color:#e8a33d}
    /* A tool's guidance there: the log's muted answer colour — not amber,
       which is what just happened, and never the red of a contradiction. */
    #stepnote.guide{color:#8fa7bb}
    /* "Update ready": the one thing in the corner that takes a tap, so it
       takes pointer events where nothing else there does; amber, the colour of
       something to act on, and on the status's own opaque pill. */
    #update{pointer-events:auto;font:inherit;color:#0a0e13;background:#e8a33d;border:none;border-radius:3px;
      padding:1px 7px;cursor:pointer;touch-action:manipulation}
    #update[hidden]{display:none}
    #update:disabled{opacity:.7;cursor:default}
    /* The open group (docs/plans/organiser.md): what is drawn joins it, so it
       is said for as long as it is open — it never fades, being a state and
       not news. Amber, the organiser's open marker's colour. */
    #opengroup{color:#e8a33d}
    /* **The mode chip** (src/modechip.ts): where · what · next, always in that
       order, beside the status. The plane in the sketch tool's green, lighter
       — the colour the plane is tinted on the canvas — with a Done beside it in
       the tools' green; the tool in the sketch's own pale ink; the next step
       muted, and guidance (a click that missed, answered) in the same muted
       blue the log answers in, set apart only by its slant: no-refusals.md's
       guidance, moved here, never red. Its parts take a press, the next step
       does not; nothing else in the corner does but Update. */
    #mode{display:inline-flex;flex-wrap:wrap;align-items:baseline;column-gap:2px;color:#9fb4c7}
    #mode button{pointer-events:auto;font:inherit;color:inherit;background:none;border:none;padding:0 3px;margin:0;
      cursor:pointer;touch-action:manipulation;border-radius:3px;white-space:nowrap;overflow-wrap:normal}
    #mode button:hover{background:#1a2430}
    #mode .plane{display:inline-flex;flex-wrap:wrap;align-items:baseline;column-gap:2px}
    #mode .plane[hidden],#mode .sep[hidden]{display:none}
    #mode .where{color:#8fe0a8}
    /* Where the next click lands (a face under the hand): said in the hover's amber, and no button. */
    #mode.landing .where{color:#e8a33d;cursor:default}
    #mode.landing .where:hover{background:none}
    #mode .look{color:#8fe0a8;border:1px solid #2f5a3e;padding:0 5px}
    #mode .done{color:#0a0e13;background:#55c07a;padding:0 6px;margin:0 2px}
    #mode .done:hover{background:#7cd59a}
    #mode .what{color:#d5e1ec}
    #mode .what:disabled{cursor:default;background:none}
    #mode .sep{color:#4d5f70}
    #mode .next{color:#8fa7bb}
    #mode .next.guide{font-style:italic}
    #mode .next:empty{display:none}
    /* Short of room beside the verdict (ModeChip.fit): the next step gives way,
       then the tool's name — never the verdict, never where or Done. */
    #mode.tight .next,#mode.tight .nsep,#mode.tighter .what,#mode.tighter .psep{display:none}
    /* The chip's tool part tapped: the options panel it opened is ringed in the
       accent for a moment, so the eye finds it wherever the viewer put it. */
    @keyframes optflash{0%,45%{box-shadow:0 0 0 2px #55c07a}100%{box-shadow:0 0 0 2px #55c07a00}}
    .panel.flash{animation:optflash 1s ease-out}
    /* The logo (src/logo.ts), top-left over the drawing, inside the safe area
       — placed and sized by src/panels.ts, for which it is the one panel that
       never moves. A button: it opens the app menu. No ground of its own; the
       mark carries its own casing for where it floats over a light face. */
    #logo{position:absolute;z-index:45;display:flex;align-items:center;justify-content:center;padding:0;margin:0;
      background:transparent;border:none;border-radius:6px;cursor:pointer;touch-action:manipulation}
    #logo svg{display:block;flex:none}
    #logo:hover,#logo[aria-expanded="true"]{background:#0e141bcc}
    /* The probe the safe-area insets are read through (main.ts): its padding
       is the four insets, and nothing else about it is ever seen. */
    #safeprobe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    canvas{display:block;width:100%;height:100%;background:#0a0e13;cursor:crosshair}
    #log{padding:4px 10px 6px;font-size:calc(11px * var(--ui));color:#7a8b9b;white-space:pre-wrap;overflow-y:auto}
    #cmdrow{display:flex;align-items:center;gap:8px;padding:0 16px 0 10px;overflow:hidden;font-size:calc(13px * var(--ui))}
    #cmd{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#d5e1ec;font-family:inherit;font-size:calc(13px * var(--ui))}
    #cmdhint{font-size:calc(10.5px * var(--ui));color:#46586a;white-space:nowrap}
    #log .in{color:#46586a}
    #log .err{color:#e0605c}
    #log .out{color:#8fa7bb}
    #hovertag{position:absolute;pointer-events:none;font-family:inherit;font-size:calc(11px * var(--ui));color:#e8a33d;
      background:#0e141bdd;border:1px solid #223041;padding:2px 6px;border-radius:3px;white-space:nowrap;z-index:50}
    /* The tooltip (src/tooltip.ts), in the hover tag's family too: its ground,
       border and corner, at the interface size. The name in the drawing's
       light ink with the key beside it, what the control does in the log's,
       the command it types in the hover tag's amber — the ink every typed
       name is in. Opaque, not the tag's see-through ground: it is read as
       a paragraph, over panels full of text. Over everything, menus included, and never in the way:
       it takes no pointer events. Wrapped at a width, held inside the window. */
    /* And the tip a tool shows as a finger chooses it (#chosentip,
       docs/plans/tool-howto.md): the same card, in an element of its own — it
       is a status the page says once, not a description of the control under
       the pointer, and nothing closes it. **It takes no pointer events**: a
       tap on it goes to whatever is under it, which is the whole of why it
       may appear unasked. How the tool is used is a line a step (.thow), in
       the drawing's light ink — it is what the tip is for — each hung from a
       dash so a step that wraps still reads as one; what else the button
       holds (.talso) muted under them. */
    #tooltip,#chosentip{position:fixed;left:0;top:0;pointer-events:none;z-index:70;box-sizing:border-box;font-family:inherit;
      font-size:calc(11px * var(--ui));line-height:1.35;color:#8fa7bb;background:#0e141b;border:1px solid #223041;
      border-radius:3px;padding:3px 7px 4px;max-width:min(calc(260px * var(--ui)), calc(100vw - 8px));box-shadow:0 4px 14px #0008}
    #tooltip[hidden],#chosentip[hidden]{display:none}
    :is(#tooltip,#chosentip) .tname{display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:#d5e1ec;white-space:nowrap}
    #tooltip .tkey{color:#7a8b9b;font-size:calc(10px * var(--ui));border:1px solid #2c3d4f;border-radius:2px;padding:0 3px}
    #tooltip .tcmd{color:#e8a33d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #tooltip .toff{color:#7a8b9b;font-style:italic}
    :is(#tooltip,#chosentip) .thow{color:#b9c7d4;padding-left:1.2em;text-indent:-1.2em}
    :is(#tooltip,#chosentip) .thow::before{content:"– ";color:#56697b}
    :is(#tooltip,#chosentip) .tsum + .thow{margin-top:2px}
    :is(#tooltip,#chosentip) .talso{color:#7a8b9b;margin-top:2px}
    /* A step is a sentence: wider than the hover's card where there is room. */
    #chosentip{z-index:69;max-width:min(calc(300px * var(--ui)), calc(100vw - 8px))}
    /* A control a finger holds for its tooltip: no callout, no selection. */
    [data-tip]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    /* The context menu, in the hover tag's family: same ground, same border,
       same corner. It is the other thing that appears at the cursor over the
       drawing, so the two ought to look like one idea. */
    /* Add workbench…'s question and the missing-workbench offer
       (docs/plans/workbenches.md): the menus' family, centred, over everything,
       inside the safe area and never wider than a phone's screen. */
    #wbconsent,#wbmissing{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;box-sizing:border-box;
      width:min(calc(360px * var(--ui)),calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      max-height:calc(100vh - 24px);overflow-y:auto;font-family:inherit;font-size:calc(11.5px * var(--ui));
      color:#b9c7d4;background:#0e141bf8;border:1px solid #2c3d50;border-radius:6px;padding:10px 12px;box-shadow:0 10px 32px #000c}
    :is(#wbconsent,#wbmissing) .wbhead{color:#e8a33d;font-size:calc(13px * var(--ui));margin-bottom:4px}
    #wbconsent .wbfile{color:#7a8b9b;margin-bottom:6px;word-break:break-all}
    #wbconsent .wbrow{padding:2px 0}
    :is(#wbconsent,#wbmissing) .wbnote{color:#7a8b9b;font-size:calc(10.5px * var(--ui));margin-top:8px;line-height:1.4}
    :is(#wbconsent,#wbmissing) .wbbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
    :is(#wbconsent,#wbmissing) button{font:inherit;color:#b9c7d4;background:#16202b;border:1px solid #2c3d50;border-radius:4px;
      padding:4px 12px;min-height:calc(24px * var(--ui));cursor:pointer}
    :is(#wbconsent,#wbmissing) button.wbyes{color:#0e141b;background:#e8a33d;border-color:#e8a33d}
    /* The offer leaves the drawing it is about in sight: under the status, not over the middle. */
    #wbmissing{top:calc(56px + env(safe-area-inset-top));transform:translate(-50%,0)}
    @media (pointer: coarse){:is(#wbconsent,#wbmissing) button{min-height:var(--target);min-width:72px}}
    #ctxmenu,#appmenu{position:absolute;font-family:inherit;font-size:calc(11.5px * var(--ui));background:#0e141bf5;
      border:1px solid #223041;border-radius:4px;padding:3px 0;z-index:60;min-width:120px;
      box-shadow:0 6px 20px #000a;user-select:none}
    :is(#ctxmenu,#appmenu) .head{padding:3px 10px 5px;margin-bottom:3px;border-bottom:1px solid #223041;
      color:#7a8b9b;font-size:calc(10.5px * var(--ui));white-space:nowrap}
    :is(#ctxmenu,#appmenu) .item{display:flex;justify-content:space-between;gap:18px;padding:3px 10px;
      color:#d5e1ec;white-space:nowrap;cursor:default}
    :is(#ctxmenu,#appmenu) .item .cmd{color:#46586a}
    /* A toolbar group's name over its tools (docs/plans/toolbar-groups.md). */
    #ctxmenu .sub{padding:4px 10px 1px;color:#46586a;font-size:calc(9.5px * var(--ui));letter-spacing:.06em;text-transform:uppercase;cursor:default}
    :is(#ctxmenu,#appmenu) .item:hover{background:#20303f;color:#e8a33d}
    :is(#ctxmenu,#appmenu) .item:hover .cmd{color:#8fa7bb}
    :is(#ctxmenu,#appmenu) .item.off,:is(#ctxmenu,#appmenu) .item.off:hover{color:#46586a;background:transparent}
    :is(#ctxmenu,#appmenu) .why{padding:0 10px 4px;color:#7a8b9b;font-size:calc(10px * var(--ui));white-space:nowrap}
    /* A row of choices (View: Shaded Hidden Wire): each word its own target,
       the one in force underlined in the hover colour. */
    #ctxmenu .row{display:flex;justify-content:space-between;gap:12px;padding:3px 10px;
      white-space:nowrap;cursor:default;border-top:1px solid #223041;margin-top:3px}
    :is(#ctxmenu .row,#appmenu) .choices{display:flex;gap:2px}
    #ctxmenu .row>span:first-child{color:#7a8b9b}
    :is(#ctxmenu,#appmenu) .choice{padding:0 6px;color:#d5e1ec;border-radius:2px;cursor:default}
    :is(#ctxmenu,#appmenu) .choice:hover{background:#20303f;color:#e8a33d}
    :is(#ctxmenu,#appmenu) .choice.on{color:#e8a33d;text-decoration:underline;text-underline-offset:3px}
    #ctxmenu .row .cmd{color:#46586a}
    /* The app menu (src/appmenu.ts): the context menu's family, dropped from
       the logo, in sections — each headed in the head's muted ink, ruled off
       from the one before. It scrolls when a landscape phone is too short
       for it. */
    #appmenu{z-index:61;overflow-y:auto;background:#0e141b;min-width:calc(220px * var(--ui));max-width:calc(100vw - 16px);padding:0 0 3px}
    #appmenu .sect+.sect{border-top:1px solid #223041}
    #appmenu .head{border-bottom:none;margin:0;padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em;font-size:calc(9.5px * var(--ui))}
    #appmenu .docname{padding:2px 10px 3px;color:#d5e1ec}
    #appmenu .docname .dirty{color:#e8a33d;margin-left:6px}
    #appmenu .choices{padding:3px 4px 5px}
    #appmenu .item.check{justify-content:flex-start;gap:8px;align-items:center}
    #appmenu .item.check .cmd{margin-left:auto;padding-left:14px}
    #appmenu .item.check input{margin:0;accent-color:#e8a33d;width:calc(13px * var(--ui));height:calc(13px * var(--ui))}
    #appmenu .about{padding:2px 10px;color:#7a8b9b;font-size:calc(10.5px * var(--ui));white-space:nowrap}
    #appmenu .about a{color:#8fa7bb}
    #buildstamp{color:inherit}
    /* The spin box, − 80% +: its faces drawn small, the buttons round them
       the hit area — a finger's target under a finger, below. */
    #appmenu .srow{padding:3px 6px 6px}
    #appmenu .spin{display:inline-flex;align-items:center;border:1px solid #223041;border-radius:4px;background:#0a0e13}
    #appmenu .spin button{display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:none;background:transparent;
      color:#d5e1ec;font-family:inherit;font-size:calc(12px * var(--ui));cursor:default;min-width:calc(22px * var(--ui));height:calc(22px * var(--ui))}
    #appmenu .spin button.val{min-width:calc(48px * var(--ui));border-inline:1px solid #223041;color:#e8a33d}
    #appmenu .spin button:hover:not(:disabled){background:#20303f}
    #appmenu .spin button:disabled{color:#2f4050}
    /* The canvas is the whole window — under the status bar and the home
       indicator too — and the chrome floats over it as panels (see
       src/panels.ts), which keep their content inside the safe area and reach
       under an inset edge they touch. Nothing reflows the drawing when the log
       fills. Panels stack from z-index 10; the status and the logo sit over
       them, and the hover tag and the menus far above any stack, being
       transient. */
    #viewwrap{position:absolute;inset:0;overflow:hidden}
    /* Two canvases, one picture: a solid's faces by WebGL with a depth test
       (#faces, src/facelayer.ts) under the 2D drawing (#cv), which is clear
       wherever it draws nothing so the faces and the ground show through.
       Every pointer listener is on #cv; the faces canvas takes no events, so
       a face can never be what a click lands on. */
    #faces{position:absolute;left:0;top:0;pointer-events:none}
    #cv{position:relative;background:transparent;touch-action:none}
    .panel{position:absolute;display:flex;flex-direction:column;box-sizing:border-box;
      background:#0e141b;border:1px solid #223041;border-radius:4px;box-shadow:0 4px 14px #0008}
    .panel *{box-sizing:border-box}
    /* The strip to drag by: the hover tag's ground and border, just tall enough
       to grab (its height is set from panels.ts, which clamps against it). */
    .panel>.ptitle{flex:none;display:flex;align-items:center;padding:0 7px;font-size:calc(9.5px * var(--ui));
      letter-spacing:.06em;color:#46586a;background:#0b1016;border-bottom:1px solid #223041;
      border-radius:3px 3px 0 0;cursor:grab;user-select:none;touch-action:none}
    .panel.held>.ptitle{cursor:grabbing;color:#7a8b9b}
    /* A drag shows where everything will land before anything moves
       (docs/plans/panels-preview.md). The panel in the hand is lifted — a
       deeper shadow, as a held card — and drawn solid; every other panel is at
       half opacity for the gesture (one class on the area, `dragging`), and
       over them a ghost — a solid white outline, a little translucent, and a
       breath of fill (the owner: "the outline should be solid white slightly
       translucent rather than dotted") — where each panel the drop would move
       will land, the held one's own (brighter) where it will snap. The ghosts' line is the interface
       size's — 1.5 px times it, rounded to the whole pixel a border is drawn
       at anyway (Chromium floors 1.95 px to 1) — so it reads on a 3× phone as
       on a desktop: 2 px at either's 100 %. The ghosts' layer and the held
       panel are lifted over the logo's row for the drag (panels.ts's
       LIFTED_Z), where a ghost may land. At the drop the
       panels glide onto their ghosts (`settling`: 120 ms, panels.ts's
       SETTLE_MS, eased out — no spring). */
    #viewwrap.dragging>.panel:not(.held){opacity:.5}
    #viewwrap.dragging>.panel.held{box-shadow:0 14px 34px #000c,0 0 0 1px #46586a}
    .pghosts{position:absolute;inset:0;pointer-events:none}
    .pghosts[hidden]{display:none}
    .pghost{position:absolute;box-sizing:border-box;border:round(calc(1.5px * var(--ui)), 1px) solid #ffffff99;border-radius:4px;background:#ffffff12}
    .pghost[data-own]{border-color:#ffffffd9;background:#ffffff1f}
    /* A refused spot (docs/plans/panels-reshuffle.md): the held pane's ghost
       is where it was, and says why a drop here leaves it there — at least
       9em wide, running out from the side nearer the middle, in the
       amber the app says "not here" in, on a dark pill; the outline stays
       the ghosts' solid translucent white. */
    .pghost[data-note]::after{content:attr(data-note);position:absolute;left:4px;top:50%;transform:translateY(-50%);

    #options .oact button:disabled{color:#2f4050;border-color:#1a2633}
    /* **See-through panels** (docs/plans/panels-overlay-lock.md; the owner:
       "a menu option to make the toolbars transparent to maximize visible
       viewport size ... like how the feature tree in solidworks changes form
       when it is overlaid over the viewport"). `overlay` on the area: every
       pane but the options panel loses its box — no ground, no border, no
       shadow, no strip, no grips — and takes no press itself; only its
       content does, so a press between two of the organiser's rows, or
       beside a tray's buttons, is the drawing's. Each pane's content is
       drawn in a form of its own: a tray its buttons alone, the organiser a
       tree hugging its corner (data-hug, from panels.ts), the log its last
       three lines, the command line its input on an underline. Text and
       glyphs carry a thin halo in the drawing's ground — a 1 px ring at the
       interface size and a soft 3 px glow — so they read over the dark
       ground and over a light face alike; a button gets a faint backplate
       only under the hand. A pane a mouse is over (`hand`) gets its box back
       — ground, border, strip — under the same content, so it reads over a
       busy drawing and can be dragged, and the tree stays a tree to open; a
       press on a pane's content (`pinned`, until the next press outside it)
       and the pane held in a drag are drawn wholly docked. Both fade back. The options panel, the
       feature dialog it holds, the menus, the flyout, the tooltip and the
       mode chip stay opaque: they are read and typed into, not looked
       through. */
    #viewwrap{--h:calc(1px * var(--ui));--hc:#0a0e13;
      --halo:var(--h) 0 0 var(--hc),calc(-1 * var(--h)) 0 0 var(--hc),0 var(--h) 0 var(--hc),0 calc(-1 * var(--h)) 0 var(--hc),
        var(--h) var(--h) 0 var(--hc),calc(-1 * var(--h)) var(--h) 0 var(--hc),var(--h) calc(-1 * var(--h)) 0 var(--hc),
        calc(-1 * var(--h)) calc(-1 * var(--h)) 0 var(--hc),0 0 calc(3 * var(--h)) var(--hc);
      --glyph-halo:drop-shadow(0 0 var(--h) var(--hc)) drop-shadow(0 0 var(--h) var(--hc))}
    .panel{transition:background-color .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out}
    .otree,.otail{display:none}
    #viewwrap.overlay>.panel:not([data-panel="options"]):not(.hand):not(.pinned):not(.held){background:transparent;border-color:transparent;box-shadow:none;pointer-events:none}
    #viewwrap.overlay>.panel:not([data-panel="options"]):not(.hand):not(.pinned):not(.held)>.ptitle{visibility:hidden}
    #viewwrap.overlay>.panel:not([data-panel="options"]):not(.hand):not(.pinned):not(.held)>.pgrip{display:none}
    /* A tray: the buttons alone, in their column or row; the group mark and the flyout unchanged. */
    #viewwrap.overlay>.panel:not(.pinned):not(.held) .tray button{pointer-events:auto}
    #viewwrap.overlay>.panel:not(.pinned):not(.held) .tray button svg{filter:var(--glyph-halo)}
    #viewwrap.overlay>.panel:not(.pinned):not(.held) .tray button:hover{background:#0e141bb8}
    #viewwrap.overlay>.panel:not(.pinned):not(.held) .tray button[data-more]::after{filter:var(--glyph-halo)}
    /* The organiser: the tree in place of the sections, in the corner it hugs. */
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>#organiser{display:none}
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>.otree{display:flex}
    .otree{position:absolute;flex-direction:column;align-items:flex-start;gap:calc(3px * var(--ui));pointer-events:none;
      max-width:calc(100% - var(--pad-l, 0px) - var(--pad-r, 0px));max-height:calc(100% - var(--pad-t, 0px) - var(--pad-b, 0px));
      overflow-y:auto;overflow-x:hidden;scrollbar-width:none;font-size:calc(11px * var(--ui))}
    .otree::-webkit-scrollbar{display:none}
    .panel[data-hug^="n"]>.otree{top:var(--pad-t, 0px)}
    .panel[data-hug^="s"]>.otree{bottom:var(--pad-b, 0px)}
    .panel[data-hug$="w"]>.otree{left:var(--pad-l, 0px)}
    .panel[data-hug$="e"]>.otree{right:var(--pad-r, 0px)}
    .otree .tnode,.otree .tkids{display:flex;flex-direction:column;align-items:flex-start;gap:calc(3px * var(--ui));max-width:100%}
    .otree .tkids{padding-left:calc(14px * var(--ui))}
    .otree .trow{pointer-events:auto;display:flex;align-items:center;gap:calc(4px * var(--ui));height:calc(16px * var(--ui));max-width:100%;
      padding:0 calc(5px * var(--ui)) 0 calc(2px * var(--ui));border-radius:3px;color:#e6eef5;white-space:nowrap;text-shadow:var(--halo);cursor:default;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .otree .trow:hover{background:#0e141bb8}
    .otree .tname{flex:none}
    .otree .tnote{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#a9bccd}
    .otree .ticon,.otree .ttog{flex:none;display:flex;align-items:center;justify-content:center;width:calc(13px * var(--ui));height:calc(13px * var(--ui))}
    .otree .ticon svg{display:block;width:100%;height:100%;filter:var(--glyph-halo)}
    .otree .ttog{padding:0;margin:0;border:none;background:transparent;color:#a9bccd;font:inherit;font-size:calc(10px * var(--ui));line-height:1;text-shadow:var(--halo);cursor:default}
    .otree .trow[data-kind="body"] .ticon{color:#afc6d9}
    .otree .trow[data-kind="feature"] .ticon{color:#8fa7bb}
    .otree .trow[data-kind="group"] .ticon{color:#c9a7f5}
    .otree .trow[data-kind="region"] .ticon{color:#7cd59a}
    .otree .trow[data-heading] .tname{font-size:calc(9.5px * var(--ui));letter-spacing:.07em;text-transform:uppercase;color:#c3d2df}
    .otree .trow.on .tname{color:#e3c6ff}
    .otree .trow[data-open] .ticon{color:#e8a33d}
    .otree .trow[data-eye="hidden"] .tname{text-decoration:line-through;color:#a9bccd}
    /* The log: its last three lines, fading with age (src/logtail.ts: whole for 3 s, gone at 10). */
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>#log{display:none}
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>.otail{display:flex}
    .otail{position:absolute;left:var(--pad-l, 0px);right:var(--pad-r, 0px);flex-direction:column;align-items:flex-start;gap:calc(1px * var(--ui));
      padding:0 calc(6px * var(--ui));pointer-events:none;font-size:calc(11px * var(--ui));line-height:1.45}
    .panel[data-hug^="n"]>.otail{top:var(--pad-t, 0px)}
    .panel[data-hug^="s"]>.otail{bottom:var(--pad-b, 0px)}
    .otail .tline{pointer-events:auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c3d2df;text-shadow:var(--halo);
      animation:tailfade 10s linear forwards}
    .otail .tline.in{color:#a9bccd}
    .otail .tline.out{color:#d5e1ec}
    .otail .tline.err{color:#ff8f8a}
    .otail .tline.guide{color:#b9d0e2}
    @keyframes tailfade{0%,30%{opacity:1}100%{opacity:0}}
    /* The command line: the prompt and the input on an underline, at its bottom edge; the hint gone. */
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>#cmdrow{pointer-events:auto;text-shadow:var(--halo)}
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>#cmdrow #cmd{text-shadow:var(--halo);border-bottom:1px solid #a9bccd;box-shadow:0 1px 0 var(--hc)}
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>#cmdrow #cmd::placeholder{color:#a9bccd;text-shadow:var(--halo)}
    #viewwrap.overlay>.panel:not(.pinned):not(.held)>#cmdrow #cmdhint{display:none}
    /* **Locked**: panels stay where they are. No strip and no grip is drawn,
       and a grip takes no press; a press on a strip's place moves nothing and
       says why in the chip (panels.ts's LOCKED_GUIDE). The strip's reach out
       over the drawing under a finger goes too, so the lock takes nothing of
       the drawing — and with see-through on as well, the strip's place is the
       drawing's. The organiser's ＋ stays: it is a control, not the strip. */
    #viewwrap.locked>.panel>.pgrip{display:none}
    #viewwrap.locked>.panel>.ptitle,#viewwrap.locked>.panel[data-orient]>.ptitle,#viewwrap.locked>.panel[data-orient]>.ptitle:hover{
      background:transparent;border-color:transparent;color:transparent;cursor:default}
    #viewwrap.locked>.panel>.ptitle::before{display:none}
    #viewwrap.locked>.panel>.ptitle .padd{color:#8fa7bb}
    /* **Under a finger: drawn at the interface size, hit at the target**
       (docs/plans/chrome-logo-scale.md, touch-density.md). Everything above
       is already drawn at the device's own size (--ui: 1.3 on a phone —
       src/uiscale.ts); what a finger needs on top is a target, and it gets it
       here **without anything being drawn bigger**: an invisible ::before
       round a small face, a row that is a target tall with its text drawn at
       the size. (They used to be one size — drawn at 44 — which is what the
       owner called huge.) **The target is --target**, set by main.ts from
       panels.ts's `target`: Apple's 44 pt at the device's own 100 %, and in
       proportion to the spin box from there (35 at 80 %, 57 at 130 %; never
       under 32) — it was a literal 44, so shrinking the interface shrank the
       type and left the rows where they were (the owner: "the text resizes
       but the spacing between e.g menu items and toolbar items barely
       changes"). A tray's buttons are drawn at 0.8 of it and spaced by
       panels.ts so that each one's pitch is a whole target, and their hit
       boxes overhang the tray's edges a little. Hover colours are left as
       they are: a finger has no hover, and a colour that sticks after a tap
       is iOS's, not ours. */
    @media (pointer: coarse){
      .tray{overflow:visible}
      .tray button{position:relative;border-radius:5px}
      .tray button::before,#options .oact button::before{content:"";position:absolute;left:50%;top:50%;
        width:max(100%,var(--target));height:max(100%,var(--target));transform:translate(-50%,-50%)}
      #options .oact button{position:relative}
      /* A strip is drawn its own thickness and grabbed over the target: its hit box
         reaches outward, over the drawing, never into the panel's content. */
      .panel>.ptitle{position:relative}
      .panel>.ptitle::before{content:"";position:absolute;left:50%;bottom:0;width:max(100%,var(--target));height:max(100%,var(--target));transform:translateX(-50%)}
      .panel[data-orient="row"]>.ptitle::before{left:auto;right:0;bottom:auto;top:50%;transform:translateY(-50%)}
      /* Fields scale with everything else. They were held at 16px at least
         here, against Safari's zoom into a focused field, which the viewport
         meta's maximum-scale=1 already prevents; the floor only stopped the
         command line shrinking below 95 % (the owner: "the cmd text does not
         scale... the title of this pane scales, but not the text itself").
         docs/plans/chrome-logo-scale.md, As built, has the retirement. */
      #cmdhint{display:none}
      #log{line-height:1.4;padding:0 10px}
      /* The see-through tree under a finger: rows drawn 20 px at the size,
         half a target of the drawing between them, and never less than
         22 px. Not closer: Chromium — Android's engine — moves a touch onto
         the nearest control its contact area reaches, and a tap in the middle
         of a gap went to a row at every gap up to 18 px with an 8 px
         fingertip (measured; 20 px was the first clear). That reach is the
         finger's, not the picture's, so the 22 holds at 80 % too, where half
         a target would be 17 (measured again there: overlaylock.e2e.ts). A
         row a target tall, as docked, would leave no gap at all. */
      .otree,.otree .tnode,.otree .tkids{gap:max(calc(6px * var(--ui)), 22px, calc(var(--target) / 2))}
      .otree .trow{height:calc(20px * var(--ui))}
      .otree .ttog{width:calc(18px * var(--ui));height:calc(20px * var(--ui))}
      /* The organiser: a row a target tall, its marker, its eye and the strip's
         ＋ each answering over the target however small they are drawn. */
      #organiser .orow{height:auto;min-height:var(--target)}
      /* The chip's parts: drawn at the size, answering over a target tall. */
      #mode button{position:relative}
      #mode button::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--target);transform:translateY(-50%)}
      /* Wrapped onto two lines, a part's target reaches over the line above:
         the plane's part, Done above all, is stacked over the tool's, so a
         tap on Done is Done (found on the landscape phone). */
      #mode .plane{position:relative;z-index:1}
      #organiser button,#constraints .cdel,.panel>.ptitle .padd{position:relative}
      #organiser button::before,#constraints .cdel::before,.panel>.ptitle .padd::before{content:"";position:absolute;left:50%;top:50%;
        width:max(100%,var(--target));height:max(100%,var(--target));transform:translate(-50%,-50%)}
      /* The palette's value field: a target tall to tap into, drawn no wider. */
      #constraints .cval{height:var(--target)}
      :is(#ctxmenu,#appmenu) .head{padding:calc(6px * var(--ui)) 14px}
      #appmenu .head{padding:calc(6px * var(--ui)) 14px calc(2px * var(--ui))}
      :is(#ctxmenu,#appmenu) .item{min-height:var(--target);align-items:center;padding:0 14px}
      #ctxmenu .row{min-height:var(--target);align-items:center;padding:0 14px}
      :is(#ctxmenu,#appmenu) .choice{display:inline-flex;align-items:center;min-height:var(--target);min-width:var(--target);padding:0 8px;justify-content:center}
      #appmenu .docname,#appmenu .about{padding:2px 14px 4px}
      /* A phone has no room for the command beside each item, and no hover to
         read it by: the log shows what each one typed. An item that is off
         keeps its reason. */
      :is(#ctxmenu,#appmenu) .item:not(.off) .cmd,#ctxmenu .row .cmd{display:none}
      #ctxmenu{max-width:calc(100vw - 8px)}
      /* − and + drawn at the menu's size, hit at a finger's: the buttons are
         a target square, which follows the size as everything else does. */
      #appmenu .srow{padding:0 6px 4px}
      #appmenu .spin button{min-width:var(--target);height:var(--target)}
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewwrap">
      <canvas id="faces"></canvas>
      <canvas id="cv"></canvas>
      <!-- The logo: ZeroCAD's mark (src/logo.ts fills it), and the way into
           the app menu. There is no title bar. -->
      <button id="logo" type="button" title="ZeroCAD — menu" aria-label="ZeroCAD — menu" aria-haspopup="menu" aria-expanded="false"></button>
      <div id="corner">
        <!-- The mode chip (src/modechip.ts; docs/plans/mode-feedback.md):
             where · what · next — the plane being sketched on, the tool in
             hand, and what the gesture wants next. Filled by main.ts. -->
        <span id="mode" aria-live="polite"></span>
        <span id="status" aria-live="polite">loading kernel…</span>
        <!-- What the solve could say beyond its verdict (docs/plans/sketch-relations.md):
             "3 free", which relations conflict or are redundant — each a name to click. -->
        <span id="diagnosis" aria-live="polite"></span>
        <span id="stepnote" aria-live="polite"></span>
        <span id="opengroup" aria-live="polite"></span>
        <!-- A new version, offered (src/update.ts): hidden until one waits. -->
        <button id="update" type="button" hidden>Update ready — tap to reload</button>
      </div>
      <!-- data-label is what the app menu's Panes calls each panel; a new
           panel needs nothing more to be listed there. -->
      <div class="panel" data-panel="toolbar" data-label="Tools">
        <div class="ptitle" title="tools"></div>
        <div id="toolbar" class="pbody tray"></div>
      </div>
      <div class="panel" data-panel="log" data-label="Log">
        <div class="ptitle">log</div>
        <div id="log" class="pbody"></div>
        <!-- See-through, the log is its last three lines over the drawing (src/logtail.ts). -->
        <div id="otail" class="otail" aria-hidden="true"></div>
      </div>
      <!-- The organiser (src/organiser.ts): the groups and the features. Its
           ＋ is in the strip, and its press never starts a drag. -->
      <div class="panel" data-panel="organiser" data-label="Organiser">
        <div class="ptitle">organiser<button class="padd" type="button" title="＋ a group of the selection — or, with nothing selected, a new empty group, open" aria-label="new group">＋</button></div>
        <div id="organiser" class="pbody"></div>
        <!-- See-through, the organiser is a tree hugging its corner (src/organiser.ts's organiserTree). -->
        <div id="otree" class="otree"></div>
      </div>
      <!-- The constraints palette (src/constraints.ts; docs/plans/constraints-palette.md):
           the relations the selection takes, and the ones it already has. -->
      <div class="panel" data-panel="constraints" data-label="Constraints">
        <div class="ptitle">constraints</div>
        <div id="constraints" class="pbody"></div>
      </div>
      <div class="panel" data-panel="options" data-label="Tool options" hidden>
        <div class="ptitle">options</div>
        <div id="options" class="pbody"></div>
      </div>
      <!-- Undo, Redo, Delete, Cancel: a finger's keys. main.ts takes it out of
           the page where the pointer is fine — a mouse has the keys. -->
      <div class="panel" data-panel="actions" data-label="Actions">
        <div class="ptitle" title="actions"></div>
        <div id="actions" class="pbody tray"></div>
      </div>
      <div class="panel" data-panel="cmd" data-label="Command line">
        <div class="ptitle">command</div>
        <div id="cmdrow" class="pbody">
          <span style="color:#e8a33d">&gt;</span>
          <input id="cmd" autocomplete="off" spellcheck="false" placeholder="a tool name, or any expression — try help()">
          <span id="cmdhint">up/down for history</span>
        </div>
      </div>
      <div id="hovertag" hidden></div>
      <!-- The tooltip every icon and short word in the chrome shares (src/tooltip.ts). -->
      <div id="tooltip" role="tooltip" hidden></div>
      <!-- The tip a tool shows as a finger chooses it (src/tooltip.ts, `announce`): it takes no touch. -->
      <div id="chosentip" role="status" aria-live="polite" hidden></div>
      <!-- A toolbar group's flyout: the family beside its button (src/panels.ts's Toolbar). -->
      <div id="flyout" class="tray" role="group" aria-label="tools in this group" hidden></div>
      <div id="ctxmenu" hidden></div>
      <div id="appmenu" role="menu" hidden></div>
    </div>
  </div>
  <!-- The build's stamp: empty here, written by scripts/singlefile.mjs into a
       built page; the app menu's About shows it. -->
  <span id="buildstamp" hidden></span>
  <div id="safeprobe"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
