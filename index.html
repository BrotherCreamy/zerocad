<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NeoCAD</title>
  <style>
    html,body{height:100%;margin:0;background:#0a0e13;color:#d5e1ec;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px}
    #app{display:flex;flex-direction:column;height:100vh}
    header{padding:8px 14px;background:#0e141b;border-bottom:1px solid #223041;display:flex;gap:14px;align-items:center}
    header b{color:#e8a33d}
    #status{font-size:11px;color:#7a8b9b}
    #status.solved{color:#55c07a}
    #status.bad{color:#e0605c}
    /* What the last undo or redo did, beside the verdict rather than over it
       (see stepNote in main.ts). Amber, the colour of what just happened. */
    #stepnote{font-size:11px;color:#e8a33d}
    /* A tool's guidance there: the log's muted answer colour — not amber,
       which is what just happened, and never the red of a contradiction. */
    #stepnote.guide{color:#8fa7bb}
    canvas{display:block;width:100%;height:100%;background:#0a0e13;cursor:crosshair}
    #log{padding:4px 10px 6px;font-size:11px;color:#7a8b9b;white-space:pre-wrap;overflow-y:auto}
    #cmdrow{display:flex;align-items:center;gap:8px;padding:0 16px 0 10px;overflow:hidden}
    #cmd{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#d5e1ec;font-family:inherit;font-size:13px}
    #cmdhint{font-size:10.5px;color:#46586a;white-space:nowrap}
    #log .in{color:#46586a}
    #log .err{color:#e0605c}
    #log .out{color:#8fa7bb}
    #hovertag{position:absolute;pointer-events:none;font-family:inherit;font-size:11px;color:#e8a33d;
      background:#0e141bdd;border:1px solid #223041;padding:2px 6px;border-radius:3px;white-space:nowrap;z-index:50}
    /* The context menu, in the hover tag's family: same ground, same border,
       same corner. It is the other thing that appears at the cursor over the
       drawing, so the two ought to look like one idea. */
    #ctxmenu{position:absolute;font-family:inherit;font-size:11.5px;background:#0e141bf5;
      border:1px solid #223041;border-radius:4px;padding:3px 0;z-index:60;min-width:120px;
      box-shadow:0 6px 20px #000a;user-select:none}
    #ctxmenu .head{padding:3px 10px 5px;margin-bottom:3px;border-bottom:1px solid #223041;
      color:#7a8b9b;font-size:10.5px;white-space:nowrap}
    #ctxmenu .item{display:flex;justify-content:space-between;gap:18px;padding:3px 10px;
      color:#d5e1ec;white-space:nowrap;cursor:default}
    #ctxmenu .item .cmd{color:#46586a}
    #ctxmenu .item:hover{background:#20303f;color:#e8a33d}
    #ctxmenu .item:hover .cmd{color:#8fa7bb}
    #ctxmenu .item.off,#ctxmenu .item.off:hover{color:#46586a;background:transparent}
    #ctxmenu .why{padding:0 10px 4px;color:#7a8b9b;font-size:10px;white-space:nowrap}
    /* The canvas is the whole of the area under the header, and the chrome
       floats over it as panels (see src/panels.ts) — so nothing reflows the
       drawing when the log fills. Panels stack from z-index 10; the hover tag
       and the menu sit far above any stack, being transient. */
    #viewwrap{position:relative;flex:1;min-height:0;overflow:hidden}
    /* Two canvases, one picture: a solid's faces by WebGL with a depth test
       (#faces, src/facelayer.ts) under the 2D drawing (#cv), which is clear
       wherever it draws nothing so the faces and the ground show through.
       Every pointer listener is on #cv; the faces canvas takes no events, so
       a face can never be what a click lands on. */
    #faces{position:absolute;left:0;top:0;pointer-events:none}
    #cv{position:relative;background:transparent}
    .panel{position:absolute;display:flex;flex-direction:column;box-sizing:border-box;
      background:#0e141b;border:1px solid #223041;border-radius:4px;box-shadow:0 4px 14px #0008}
    .panel *{box-sizing:border-box}
    /* The strip to drag by: the hover tag's ground and border, just tall enough
       to grab (its height is set from panels.ts, which clamps against it). */
    .panel>.ptitle{flex:none;display:flex;align-items:center;padding:0 7px;font-size:9.5px;
      letter-spacing:.06em;color:#46586a;background:#0b1016;border-bottom:1px solid #223041;
      border-radius:3px 3px 0 0;cursor:grab;user-select:none;touch-action:none}
    .panel.held>.ptitle{cursor:grabbing;color:#7a8b9b}
    .panel>.pbody{flex:1;min-height:0}
    /* A grip on each corner of a panel that resizes — the log and the command
       line; a tray has none — made by panels.ts: a 12px square clipped to the
       triangle in its corner, so that it takes only the corner and a strip
       keeps its middle. It draws nothing (the owner: "you dont need those diag
       lines on every corner"): the cursor of its diagonal is the whole of the
       affordance. The clip is written for the south-east and mirrored into the
       other three corners by the transforms. */
    .panel>.pgrip{position:absolute;width:12px;height:12px;touch-action:none;clip-path:polygon(100% 0,100% 100%,0 100%)}
    .panel>.pgrip[data-corner="se"]{right:0;bottom:0;cursor:nwse-resize}
    .panel>.pgrip[data-corner="nw"]{left:0;top:0;cursor:nwse-resize;transform:scale(-1,-1)}
    .panel>.pgrip[data-corner="ne"]{right:0;top:0;cursor:nesw-resize;transform:scaleY(-1)}
    .panel>.pgrip[data-corner="sw"]{left:0;bottom:0;cursor:nesw-resize;transform:scaleX(-1)}
    /* A tray — the toolbar — runs as a column or a row (data-orient, set from
       panels.ts, which sizes it to match: one 20px button thick, and as long
       as its buttons). A row's strip
       is down its left end, so the row is one button high. The strip is too
       narrow for a word either way, so it is a grip of dots; its title names it. */
    .panel[data-orient="row"]{flex-direction:row}
    .panel[data-orient]>.ptitle{padding:0;font-size:0;
      background:#0b1016 radial-gradient(circle,#2c3d4f 0.8px,transparent 1.2px) center/4px 4px}
    .panel.held[data-orient]>.ptitle,.panel[data-orient]>.ptitle:hover{
      background:#0b1016 radial-gradient(circle,#46586a 0.8px,transparent 1.2px) center/4px 4px}
    .panel[data-orient="row"]>.ptitle{border-bottom:none;border-right:1px solid #223041;border-radius:3px 0 0 3px}
    /* The toolbar: one square button per registered tool, its face the tool's
       icon in currentColor — so the colours below are the glyph's. The amber is
       the armed tool's and nothing else's. One line of them, the way the tray
       runs, and panels.ts sizes the tray to exactly that line (traySize). The
       overflow is hidden for the one case where the line does not fit — a
       window shorter than it — so the buttons past the edge are clipped there
       rather than drawn over the window's edge. */
    #toolbar{display:flex;flex-direction:column;gap:2px;padding:3px;overflow:hidden}
    .panel[data-orient="row"]>#toolbar{flex-direction:row}
    #toolbar button{flex:none;width:20px;height:20px;padding:0;display:flex;align-items:center;justify-content:center;
      font-family:inherit;color:#afc6d9;background:transparent;border:1px solid transparent;border-radius:3px;cursor:default}
    #toolbar button svg{flex:none;display:block}
    #toolbar button:hover{background:#20303f;color:#d5e1ec}
    #toolbar button[aria-pressed="true"]{color:#e8a33d;border-color:#e8a33d80;background:#e8a33d18}
    /* A tool that cannot run: the menu's .item.off — muted, no hover lift, and
       never amber, even if it was armed before the frame it needed went away.
       After the pressed rule, which it ties on specificity and must beat. */
    #toolbar button:disabled,#toolbar button:disabled:hover{color:#46586a;background:transparent;border-color:transparent}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span>NEO<b>CAD</b></span>
      <span id="status">loading kernel…</span>
      <span id="stepnote" aria-live="polite"></span>
    </header>
    <div id="viewwrap">
      <canvas id="faces"></canvas>
      <canvas id="cv"></canvas>
      <div class="panel" data-panel="toolbar">
        <div class="ptitle" title="tools"></div>
        <div id="toolbar" class="pbody"></div>
      </div>
      <div class="panel" data-panel="log">
        <div class="ptitle">log</div>
        <div id="log" class="pbody"></div>
      </div>
      <div class="panel" data-panel="cmd">
        <div class="ptitle">command</div>
        <div id="cmdrow" class="pbody">
          <span style="color:#e8a33d">&gt;</span>
          <input id="cmd" autocomplete="off" spellcheck="false" placeholder="a tool name, or any expression — try help()">
          <span id="cmdhint">up/down for history</span>
        </div>
      </div>
      <div id="hovertag" hidden></div>
      <div id="ctxmenu" hidden></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
