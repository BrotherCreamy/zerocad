<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The page never zooms, and covers the whole screen, notch and all — the
       app keeps itself clear of the notch by the safe-area insets below.
       Every build carries these: scripts/singlefile.mjs takes each
       <meta name> from here. docs/plans/pwa-pages.md. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- iOS turns a run of digits into a phone link; a log of coordinates is
       full of them. -->
  <meta name="format-detection" content="telephone=no">
  <title>ZeroCAD</title>
  <style>
    /* The page itself never moves (docs/plans/pwa-pages.md): fixed to the
       viewport, nothing to scroll, no rubber band, so a finger on the chrome
       cannot drag the app off the screen. Every touch on the chrome may pan
       (the log scrolls) but never double-tap zoom; the canvas takes touch-
       action none below, all of every touch its own. Nothing selects or
       raises iOS's long-press callout except where there is text to take —
       the command line, the log, a field — and no grey flash on a tap. The
       pinch iOS zooms on in spite of the viewport is refused by
       src/pagelock.ts. */
    /* The interface size (src/uiscale.ts): --ui is the factor, and the sizes
       the panels' arithmetic also uses are set from src/panels.ts's Metrics
       as their own properties, so a strip here is the height its panel was
       sized for. Everything else drawn for a person to read or hit is
       multiplied by --ui below. The defaults are a mouse's 100 %, so the page
       before main.ts runs is what it always was. */
    :root{--ui:1;--title:16px;--button:20px;--gap:2px;--icon:16px;--grip:12px;--orow:22px}
    html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;margin:0;background:#0a0e13;color:#d5e1ec;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;
      touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    #cmd,#log,input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
    /* **The whole window, by its edges — not 100dvh.** In an iOS home-screen
       app with a black-translucent status bar, 100vh and 100dvh are the
       screen less the status bar's inset (measured from the owner's
       screenshot: the drawing ended 62 pt above the home indicator's band on
       a phone whose top inset is 62 pt — docs/plans/chrome-logo-scale.md),
       which is what left the command line short of the bottom however far it
       was dragged. A fixed box with all four edges at 0 is the viewport
       itself, which in a standalone app is the whole screen. */
    #app{position:fixed;inset:0}
    /* There is no title bar. The status — the solve's verdict, the step note
       after it — is small text beside the logo, over the drawing, inside the
       safe area. It takes no pointer events, so a drag across the corner
       reaches the canvas; only the logo does (src/statusline.ts says when it
       fades). The text is kept when it fades: only the picture goes.
       **It never lies over a pane** (docs/plans/everything-fits.md): main.ts
       holds it to the room the layout leaves it (src/panels.ts's cornerRoom)
       — the logo's row, which the defaults keep empty, short of any pane the
       viewer drags into it — and it wraps inside that, a long word broken
       rather than run out, and is cut off rather than drawn past it. */
    #corner{position:absolute;z-index:40;pointer-events:none;display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;
      font-size:calc(11px * var(--ui));line-height:1.35;max-width:calc(100% - 24px);overflow:hidden}
    #corner>span{padding:1px 5px;border-radius:3px;background:#0a0e13f0;transition:opacity .6s;min-width:0;overflow-wrap:anywhere}
    #corner>span:empty{display:none}
    #status{color:#7a8b9b}
    #status[data-faded]{opacity:0}
    #status.solved{color:#55c07a}
    #status.bad{color:#e0605c}
    /* What the last undo or redo did, beside the verdict rather than over it
       (see stepNote in main.ts). Amber, the colour of what just happened. */
    #stepnote{color:#e8a33d}
    /* A tool's guidance there: the log's muted answer colour — not amber,
       which is what just happened, and never the red of a contradiction. */
    #stepnote.guide{color:#8fa7bb}
    /* "Update ready": the one thing in the corner that takes a tap, so it
       takes pointer events where nothing else there does; amber, the colour of
       something to act on, and on the status's own opaque pill. */
    #update{pointer-events:auto;font:inherit;color:#0a0e13;background:#e8a33d;border:none;border-radius:3px;
      padding:1px 7px;cursor:pointer;touch-action:manipulation}
    #update[hidden]{display:none}
    #update:disabled{opacity:.7;cursor:default}
    /* The open group (docs/plans/organiser.md): what is drawn joins it, so it
       is said for as long as it is open — it never fades, being a state and
       not news. Amber, the organiser's open marker's colour. */
    #opengroup{color:#e8a33d}
    /* The logo (src/logo.ts), top-left over the drawing, inside the safe area
       — placed and sized by src/panels.ts, for which it is the one panel that
       never moves. A button: it opens the app menu. No ground of its own; the
       mark carries its own casing for where it floats over a light face. */
    #logo{position:absolute;z-index:45;display:flex;align-items:center;justify-content:center;padding:0;margin:0;
      background:transparent;border:none;border-radius:6px;cursor:pointer;touch-action:manipulation}
    #logo svg{display:block;flex:none}
    #logo:hover,#logo[aria-expanded="true"]{background:#0e141bcc}
    /* The probe the safe-area insets are read through (main.ts): its padding
       is the four insets, and nothing else about it is ever seen. */
    #safeprobe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    canvas{display:block;width:100%;height:100%;background:#0a0e13;cursor:crosshair}
    #log{padding:4px 10px 6px;font-size:calc(11px * var(--ui));color:#7a8b9b;white-space:pre-wrap;overflow-y:auto}
    #cmdrow{display:flex;align-items:center;gap:8px;padding:0 16px 0 10px;overflow:hidden;font-size:calc(13px * var(--ui))}
    #cmd{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#d5e1ec;font-family:inherit;font-size:calc(13px * var(--ui))}
    #cmdhint{font-size:calc(10.5px * var(--ui));color:#46586a;white-space:nowrap}
    #log .in{color:#46586a}
    #log .err{color:#e0605c}
    #log .out{color:#8fa7bb}
    #hovertag{position:absolute;pointer-events:none;font-family:inherit;font-size:calc(11px * var(--ui));color:#e8a33d;
      background:#0e141bdd;border:1px solid #223041;padding:2px 6px;border-radius:3px;white-space:nowrap;z-index:50}
    /* The tooltip (src/tooltip.ts), in the hover tag's family too: its ground,
       border and corner, at the interface size. The name in the drawing's
       light ink with the key beside it, what the control does in the log's,
       the command it types in the hover tag's amber — the ink every typed
       name is in. Opaque, not the tag's see-through ground: it is read as
       a paragraph, over panels full of text. Over everything, menus included, and never in the way:
       it takes no pointer events. Wrapped at a width, held inside the window. */
    #tooltip{position:fixed;left:0;top:0;pointer-events:none;z-index:70;box-sizing:border-box;font-family:inherit;
      font-size:calc(11px * var(--ui));line-height:1.35;color:#8fa7bb;background:#0e141b;border:1px solid #223041;
      border-radius:3px;padding:3px 7px 4px;max-width:min(calc(260px * var(--ui)), calc(100vw - 8px));box-shadow:0 4px 14px #0008}
    #tooltip[hidden]{display:none}
    #tooltip .tname{display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:#d5e1ec;white-space:nowrap}
    #tooltip .tkey{color:#7a8b9b;font-size:calc(10px * var(--ui));border:1px solid #2c3d4f;border-radius:2px;padding:0 3px}
    #tooltip .tcmd{color:#e8a33d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #tooltip .toff{color:#7a8b9b;font-style:italic}
    /* A control a finger holds for its tooltip: no callout, no selection. */
    [data-tip]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    /* The context menu, in the hover tag's family: same ground, same border,
       same corner. It is the other thing that appears at the cursor over the
       drawing, so the two ought to look like one idea. */
    #ctxmenu,#appmenu{position:absolute;font-family:inherit;font-size:calc(11.5px * var(--ui));background:#0e141bf5;
      border:1px solid #223041;border-radius:4px;padding:3px 0;z-index:60;min-width:120px;
      box-shadow:0 6px 20px #000a;user-select:none}
    :is(#ctxmenu,#appmenu) .head{padding:3px 10px 5px;margin-bottom:3px;border-bottom:1px solid #223041;
      color:#7a8b9b;font-size:calc(10.5px * var(--ui));white-space:nowrap}
    :is(#ctxmenu,#appmenu) .item{display:flex;justify-content:space-between;gap:18px;padding:3px 10px;
      color:#d5e1ec;white-space:nowrap;cursor:default}
    :is(#ctxmenu,#appmenu) .item .cmd{color:#46586a}
    :is(#ctxmenu,#appmenu) .item:hover{background:#20303f;color:#e8a33d}
    :is(#ctxmenu,#appmenu) .item:hover .cmd{color:#8fa7bb}
    :is(#ctxmenu,#appmenu) .item.off,:is(#ctxmenu,#appmenu) .item.off:hover{color:#46586a;background:transparent}
    :is(#ctxmenu,#appmenu) .why{padding:0 10px 4px;color:#7a8b9b;font-size:calc(10px * var(--ui));white-space:nowrap}
    /* A row of choices (View: Shaded Hidden Wire): each word its own target,
       the one in force underlined in the hover colour. */
    #ctxmenu .row{display:flex;justify-content:space-between;gap:12px;padding:3px 10px;
      white-space:nowrap;cursor:default;border-top:1px solid #223041;margin-top:3px}
    :is(#ctxmenu .row,#appmenu) .choices{display:flex;gap:2px}
    #ctxmenu .row>span:first-child{color:#7a8b9b}
    :is(#ctxmenu,#appmenu) .choice{padding:0 6px;color:#d5e1ec;border-radius:2px;cursor:default}
    :is(#ctxmenu,#appmenu) .choice:hover{background:#20303f;color:#e8a33d}
    :is(#ctxmenu,#appmenu) .choice.on{color:#e8a33d;text-decoration:underline;text-underline-offset:3px}
    #ctxmenu .row .cmd{color:#46586a}
    /* The app menu (src/appmenu.ts): the context menu's family, dropped from
       the logo, in sections — each headed in the head's muted ink, ruled off
       from the one before. It scrolls when a landscape phone is too short
       for it. */
    #appmenu{z-index:61;overflow-y:auto;background:#0e141b;min-width:calc(220px * var(--ui));max-width:calc(100vw - 16px);padding:0 0 3px}
    #appmenu .sect+.sect{border-top:1px solid #223041}
    #appmenu .head{border-bottom:none;margin:0;padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em;font-size:calc(9.5px * var(--ui))}
    #appmenu .docname{padding:2px 10px 3px;color:#d5e1ec}
    #appmenu .docname .dirty{color:#e8a33d;margin-left:6px}
    #appmenu .choices{padding:3px 4px 5px}
    #appmenu .item.check{justify-content:flex-start;gap:8px;align-items:center}
    #appmenu .item.check .cmd{margin-left:auto;padding-left:14px}
    #appmenu .item.check input{margin:0;accent-color:#e8a33d;width:calc(13px * var(--ui));height:calc(13px * var(--ui))}
    #appmenu .about{padding:2px 10px;color:#7a8b9b;font-size:calc(10.5px * var(--ui));white-space:nowrap}
    #appmenu .about a{color:#8fa7bb}
    #buildstamp{color:inherit}
    /* The spin box, − 80% +: its faces drawn small, the buttons round them
       the hit area — a finger's 44 px under a finger, below. */
    #appmenu .srow{padding:3px 6px 6px}
    #appmenu .spin{display:inline-flex;align-items:center;border:1px solid #223041;border-radius:4px;background:#0a0e13}
    #appmenu .spin button{display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:none;background:transparent;
      color:#d5e1ec;font-family:inherit;font-size:calc(12px * var(--ui));cursor:default;min-width:calc(22px * var(--ui));height:calc(22px * var(--ui))}
    #appmenu .spin button.val{min-width:calc(48px * var(--ui));border-inline:1px solid #223041;color:#e8a33d}
    #appmenu .spin button:hover:not(:disabled){background:#20303f}
    #appmenu .spin button:disabled{color:#2f4050}
    /* The canvas is the whole window — under the status bar and the home
       indicator too — and the chrome floats over it as panels (see
       src/panels.ts), which keep their content inside the safe area and reach
       under an inset edge they touch. Nothing reflows the drawing when the log
       fills. Panels stack from z-index 10; the status and the logo sit over
       them, and the hover tag and the menus far above any stack, being
       transient. */
    #viewwrap{position:absolute;inset:0;overflow:hidden}
    /* Two canvases, one picture: a solid's faces by WebGL with a depth test
       (#faces, src/facelayer.ts) under the 2D drawing (#cv), which is clear
       wherever it draws nothing so the faces and the ground show through.
       Every pointer listener is on #cv; the faces canvas takes no events, so
       a face can never be what a click lands on. */
    #faces{position:absolute;left:0;top:0;pointer-events:none}
    #cv{position:relative;background:transparent;touch-action:none}
    .panel{position:absolute;display:flex;flex-direction:column;box-sizing:border-box;
      background:#0e141b;border:1px solid #223041;border-radius:4px;box-shadow:0 4px 14px #0008}
    .panel *{box-sizing:border-box}
    /* The strip to drag by: the hover tag's ground and border, just tall enough
       to grab (its height is set from panels.ts, which clamps against it). */
    .panel>.ptitle{flex:none;display:flex;align-items:center;padding:0 7px;font-size:calc(9.5px * var(--ui));
      letter-spacing:.06em;color:#46586a;background:#0b1016;border-bottom:1px solid #223041;
      border-radius:3px 3px 0 0;cursor:grab;user-select:none;touch-action:none}
    .panel.held>.ptitle{cursor:grabbing;color:#7a8b9b}
    .panel>.pbody{flex:1;min-height:0}
    /* A grip on each corner of a panel that resizes — the log and the command
       line; a tray has none — made by panels.ts: a 12px square clipped to the
       triangle in its corner, so that it takes only the corner and a strip
       keeps its middle. It draws nothing (the owner: "you dont need those diag
       lines on every corner"): the cursor of its diagonal is the whole of the
       affordance. The clip is written for the south-east and mirrored into the
       other three corners by the transforms. */
    .panel>.pgrip{position:absolute;width:var(--grip);height:var(--grip);touch-action:none;clip-path:polygon(100% 0,100% 100%,0 100%)}
    .panel>.pgrip[data-corner="se"]{right:var(--pad-r,0px);bottom:var(--pad-b,0px);cursor:nwse-resize}
    .panel>.pgrip[data-corner="nw"]{left:var(--pad-l,0px);top:var(--pad-t,0px);cursor:nwse-resize;transform:scale(-1,-1)}
    .panel>.pgrip[data-corner="ne"]{right:var(--pad-r,0px);top:var(--pad-t,0px);cursor:nesw-resize;transform:scaleY(-1)}
    .panel>.pgrip[data-corner="sw"]{left:var(--pad-l,0px);bottom:var(--pad-b,0px);cursor:nesw-resize;transform:scaleX(-1)}
    /* A panel reaching under an inset it touches (src/panels.ts's bleed): its
       ground runs to the glass, so the border and the corner on that side
       go — it is the screen's edge now, as iOS's toolbars are. */
    .panel[data-bleed~="top"]{border-top-color:transparent;border-top-left-radius:0;border-top-right-radius:0}
    .panel[data-bleed~="bottom"]{border-bottom-color:transparent;border-bottom-left-radius:0;border-bottom-right-radius:0}
    .panel[data-bleed~="left"]{border-left-color:transparent;border-top-left-radius:0;border-bottom-left-radius:0}
    .panel[data-bleed~="right"]{border-right-color:transparent;border-top-right-radius:0;border-bottom-right-radius:0}
    /* A tray — the toolbar — runs as a column or a row (data-orient, set from
       panels.ts, which sizes it to match: one 20px button thick, and as long
       as its buttons). A row's strip
       is down its left end, so the row is one button high. The strip is too
       narrow for a word either way, so it is a grip of dots; its title names it. */
    .panel[data-orient="row"]{flex-direction:row}
    .panel[data-orient]>.ptitle{padding:0;font-size:0;
      background:#0b1016 radial-gradient(circle,#2c3d4f 0.8px,transparent 1.2px) center/4px 4px}
    .panel.held[data-orient]>.ptitle,.panel[data-orient]>.ptitle:hover{
      background:#0b1016 radial-gradient(circle,#46586a 0.8px,transparent 1.2px) center/4px 4px}
    .panel[data-orient="row"]>.ptitle{border-bottom:none;border-right:1px solid #223041;border-radius:3px 0 0 3px}
    /* A tray's buttons — the toolbar's, one square per registered tool, its
       face the tool's icon in currentColor, so the colours below are the
       glyph's; and the action strip's (touch only). The amber is the armed
       tool's and nothing else's. A line of them the way the tray runs — and
       where one line does not fit, a second beside it, filled in the same
       order (docs/plans/everything-fits.md): a grid --per buttons long, which
       panels.ts sets from the size it gave the tray (traySize), the lines a
       button pitch apart as the buttons are. The overflow is hidden for the
       one case where even a line per button does not fit, so the buttons past
       the edge are clipped there rather than drawn over the window's edge. */
    .tray{display:grid;gap:var(--gap);padding:3px;overflow:hidden;align-content:start;justify-content:start;
      grid-auto-flow:column;grid-template-rows:repeat(var(--per,1),var(--button));grid-auto-columns:var(--button)}
    .panel[data-orient="row"]>.tray{grid-auto-flow:row;grid-template-rows:none;grid-auto-rows:var(--button);
      grid-template-columns:repeat(var(--per,1),var(--button))}
    .tray button{flex:none;width:var(--button);height:var(--button);padding:0;display:flex;align-items:center;justify-content:center;
      font-family:inherit;color:#afc6d9;background:transparent;border:1px solid transparent;border-radius:3px;cursor:default}
    .tray button svg{flex:none;display:block;width:var(--icon);height:var(--icon)}
    .tray button:hover{background:#20303f;color:#d5e1ec}
    .tray button[aria-pressed="true"]{color:#e8a33d;border-color:#e8a33d80;background:#e8a33d18}
    /* An action that would do nothing now (nothing to undo, nothing selected). */
    .tray button:disabled,.tray button:disabled:hover{color:#2f4050;background:transparent}
    /* A panel that comes and goes (the options panel) is hidden by the
       attribute, which .panel's display:flex would otherwise beat. */
    .panel[hidden]{display:none}
    /* The organiser (src/organiser.ts): a section a title and its rows, a row
       its open marker, name, count and eye. Drawn at the interface size; a
       row lit violet, the selection's colour, while its members are selected,
       and the open group's marker amber. The ＋ in the strip makes a group. */
    /* Over the north-east grip, which would otherwise take its press: the
       corner keeps the rest of its triangle to resize by. */
    .panel>.ptitle .padd{position:relative;z-index:1;margin-left:auto;margin-right:-5px;padding:0 5px;height:100%;display:flex;align-items:center;
      border:none;background:transparent;color:#8fa7bb;font-family:inherit;font-size:calc(13px * var(--ui));line-height:1;cursor:default}
    .panel>.ptitle .padd:hover{color:#e8a33d}
    #organiser{overflow-y:auto;overflow-x:hidden;padding:1px 0 4px;font-size:calc(11px * var(--ui));color:#8fa7bb;touch-action:pan-y;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #organiser .ohead{padding:calc(4px * var(--ui)) 8px calc(1px * var(--ui));font-size:calc(9px * var(--ui));letter-spacing:.07em;
      text-transform:uppercase;color:#46586a}
    #organiser .onone{padding:0 8px calc(3px * var(--ui));font-size:calc(10px * var(--ui));color:#46586a}
    #organiser .orow{display:flex;align-items:center;gap:calc(4px * var(--ui));height:calc(20px * var(--ui));padding:0 4px;cursor:default}
    #organiser .orow:hover{background:#16212c}
    #organiser .orow.on{background:#c46cff1f}
    #organiser .orow.on .oname{color:#dcb6ff}
    #organiser .oname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5e1ec}
    #organiser .odetail{flex:none;color:#46586a}
    #organiser .ocount{flex:none;min-width:calc(14px * var(--ui));text-align:right;color:#7a8b9b;font-variant-numeric:tabular-nums}
    #organiser button,#organiser .slot{flex:none;display:flex;align-items:center;justify-content:center;width:calc(16px * var(--ui));
      height:calc(16px * var(--ui));padding:0;margin:0;border:none;border-radius:3px;background:transparent;color:#7a8b9b;
      font-family:inherit;font-size:calc(10px * var(--ui));line-height:1;cursor:default}
    #organiser button svg{display:block;width:calc(13px * var(--ui));height:calc(13px * var(--ui))}
    #organiser button:hover:not(:disabled){background:#20303f;color:#d5e1ec}
    #organiser button:disabled{color:#2f4050}
    #organiser .oopen{color:#46586a}
    #organiser .orow[data-open] .oopen,#organiser .orow[data-open] .oopen:hover{color:#e8a33d}
    #organiser .oeye[data-eye="hidden"]{color:#46586a}
    /* The armed tool's options, one 22px row each (OPTION_ROW in panels.ts,
       which sizes the panel to match: strip, 3px padding, border, rows). The
       strip names the tool. A row is the label, a field and the unit — the
       field in the command line's ink on the log's ground, amber while it has
       the focus, the colour of the armed tool. */
    #options{padding:3px 6px;overflow:hidden}
    #options .orow{display:flex;align-items:center;gap:6px;height:var(--orow);font-size:calc(11px * var(--ui));color:#8fa7bb}
    #options .olabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #options .oval{flex:none;width:calc(64px * var(--ui));height:calc(18px * var(--ui));padding:0 5px;font-family:inherit;font-size:calc(11px * var(--ui));color:#d5e1ec;
      background:#0a0e13;border:1px solid #223041;border-radius:3px;outline:none;text-align:right}
    #options .oval[type="checkbox"]{width:calc(14px * var(--ui));height:calc(14px * var(--ui));margin:0 calc(25px * var(--ui));accent-color:#e8a33d}
    #options .oval:focus{border-color:#e8a33d80;color:#e8a33d}
    #options .ounit{flex:none;min-width:calc(24px * var(--ui));white-space:nowrap;color:#46586a}
    /* A feature's ✓ and ✗, under its options: ✓ in the tools' green, dim and
       inert until the picks are enough, ✗ in the panel's ink. */
    /* A word option (an extrude's mode): a button per word, the one chosen
       down in amber; the default's choice for what is picked dimly down; one
       worth offering (Cut, into a body) outlined in amber. */
    #options .ochoice{gap:3px}
    #options .ochoose{flex:none;min-width:calc(25px * var(--ui));height:calc(18px * var(--ui));padding:0 3px;font-family:inherit;font-size:calc(11px * var(--ui));
      background:transparent;border:1px solid #223041;border-radius:3px;cursor:default;color:#8fa7bb}
    #options .ochoose:hover{background:#20303f;color:#d5e1ec}
    #options .ochoose[aria-pressed="true"]{background:#e8a33d33;border-color:#e8a33d;color:#e8a33d}
    #options .ochoose.resolved{background:#16212c;border-color:#46586a;color:#d5e1ec}
    #options .ochoose.offer{border-color:#e8a33d;color:#e8a33d}
    #options .oact{justify-content:flex-end;gap:4px}
    #options .oact button{flex:none;width:calc(28px * var(--ui));height:calc(18px * var(--ui));padding:0;font-family:inherit;font-size:calc(12px * var(--ui));line-height:calc(16px * var(--ui));
      background:transparent;border:1px solid #223041;border-radius:3px;cursor:default;color:#8fa7bb}
    #options .oact button.ok{color:#55c07a;border-color:#55c07a80}
    #options .oact button.ok:hover:not(:disabled){background:#55c07a22}
    #options .oact button.no:hover{background:#20303f;color:#d5e1ec}
    #options .oact button:disabled{color:#2f4050;border-color:#1a2633}
    /* **Under a finger: drawn at the interface size, hit at 44 px**
       (docs/plans/chrome-logo-scale.md). Everything above is already drawn at
       the device's own size (--ui: 1.3 on a phone — src/uiscale.ts); what a
       finger needs on top is a target of Apple's 44 pt, a CSS pixel being a
       point on an iPhone, and it gets it here **without anything being drawn
       bigger**: an invisible ::before round a small face, a row that is a
       target tall with its text drawn at the size. (They used to be one
       size — drawn at 44 — which is what the owner called huge.) A tray's
       buttons are spaced by panels.ts so that each one's pitch is a whole
       target, and their hit boxes overhang the tray's edges a little.
       **Fields stay at 16 px type at least**: below it iOS zooms the page
       into any field it focuses, and a zoomed page is the one thing the page
       lock cannot undo. Hover colours are left as they are: a finger has no
       hover, and a colour that sticks after a tap is iOS's, not ours. */
    @media (pointer: coarse){
      .tray{overflow:visible}
      .tray button{position:relative;border-radius:5px}
      .tray button::before,#options .oact button::before{content:"";position:absolute;left:50%;top:50%;
        width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
      #options .oact button{position:relative}
      /* A strip is drawn its own thickness and grabbed over 44: its hit box
         reaches outward, over the drawing, never into the panel's content. */
      .panel>.ptitle{position:relative}
      .panel>.ptitle::before{content:"";position:absolute;left:50%;bottom:0;width:max(100%,44px);height:max(100%,44px);transform:translateX(-50%)}
      .panel[data-orient="row"]>.ptitle::before{left:auto;right:0;bottom:auto;top:50%;transform:translateY(-50%)}
      #cmd{font-size:max(16px, calc(13px * var(--ui)))}
      #cmdhint{display:none}
      #log{line-height:1.4;padding:0 10px}
      #options .oval[type="text"]{font-size:max(16px, calc(11px * var(--ui)))}
      /* The organiser: a row a target tall, its marker, its eye and the strip's
         ＋ each answering over 44 however small they are drawn. */
      #organiser .orow{height:auto;min-height:44px}
      #organiser button,.panel>.ptitle .padd{position:relative}
      #organiser button::before,.panel>.ptitle .padd::before{content:"";position:absolute;left:50%;top:50%;
        width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
      :is(#ctxmenu,#appmenu) .head{padding:calc(6px * var(--ui)) 14px}
      #appmenu .head{padding:calc(6px * var(--ui)) 14px calc(2px * var(--ui))}
      :is(#ctxmenu,#appmenu) .item{min-height:44px;align-items:center;padding:0 14px}
      #ctxmenu .row{min-height:44px;align-items:center;padding:0 14px}
      :is(#ctxmenu,#appmenu) .choice{display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:0 8px;justify-content:center}
      #appmenu .docname,#appmenu .about{padding:2px 14px 4px}
      /* A phone has no room for the command beside each item, and no hover to
         read it by: the log shows what each one typed. An item that is off
         keeps its reason. */
      :is(#ctxmenu,#appmenu) .item:not(.off) .cmd,#ctxmenu .row .cmd{display:none}
      #ctxmenu{max-width:calc(100vw - 8px)}
      /* − and + drawn at the menu's size, hit at a finger's: the buttons are
         44 px whatever the interface size; only their faces scale. */
      #appmenu .srow{padding:0 6px 4px}
      #appmenu .spin button{min-width:44px;height:44px}
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewwrap">
      <canvas id="faces"></canvas>
      <canvas id="cv"></canvas>
      <!-- The logo: ZeroCAD's mark (src/logo.ts fills it), and the way into
           the app menu. There is no title bar. -->
      <button id="logo" type="button" title="ZeroCAD — menu" aria-label="ZeroCAD — menu" aria-haspopup="menu" aria-expanded="false"></button>
      <div id="corner">
        <span id="status" aria-live="polite">loading kernel…</span>
        <span id="stepnote" aria-live="polite"></span>
        <span id="opengroup" aria-live="polite"></span>
        <!-- A new version, offered (src/update.ts): hidden until one waits. -->
        <button id="update" type="button" hidden>Update ready — tap to reload</button>
      </div>
      <!-- data-label is what the app menu's Panes calls each panel; a new
           panel needs nothing more to be listed there. -->
      <div class="panel" data-panel="toolbar" data-label="Tools">
        <div class="ptitle" title="tools"></div>
        <div id="toolbar" class="pbody tray"></div>
      </div>
      <div class="panel" data-panel="log" data-label="Log">
        <div class="ptitle">log</div>
        <div id="log" class="pbody"></div>
      </div>
      <!-- The organiser (src/organiser.ts): the groups and the features. Its
           ＋ is in the strip, and its press never starts a drag. -->
      <div class="panel" data-panel="organiser" data-label="Organiser">
        <div class="ptitle">organiser<button class="padd" type="button" title="＋ a group of the selection — or, with nothing selected, a new empty group, open" aria-label="new group">＋</button></div>
        <div id="organiser" class="pbody"></div>
      </div>
      <div class="panel" data-panel="options" data-label="Tool options" hidden>
        <div class="ptitle">options</div>
        <div id="options" class="pbody"></div>
      </div>
      <!-- Undo, Redo, Delete, Cancel: a finger's keys. main.ts takes it out of
           the page where the pointer is fine — a mouse has the keys. -->
      <div class="panel" data-panel="actions" data-label="Actions">
        <div class="ptitle" title="actions"></div>
        <div id="actions" class="pbody tray"></div>
      </div>
      <div class="panel" data-panel="cmd" data-label="Command line">
        <div class="ptitle">command</div>
        <div id="cmdrow" class="pbody">
          <span style="color:#e8a33d">&gt;</span>
          <input id="cmd" autocomplete="off" spellcheck="false" placeholder="a tool name, or any expression — try help()">
          <span id="cmdhint">up/down for history</span>
        </div>
      </div>
      <div id="hovertag" hidden></div>
      <!-- The tooltip every icon and short word in the chrome shares (src/tooltip.ts). -->
      <div id="tooltip" role="tooltip" hidden></div>
      <div id="ctxmenu" hidden></div>
      <div id="appmenu" role="menu" hidden></div>
    </div>
  </div>
  <!-- The build's stamp: empty here, written by scripts/singlefile.mjs into a
       built page; the app menu's About shows it. -->
  <span id="buildstamp" hidden></span>
  <div id="safeprobe"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
