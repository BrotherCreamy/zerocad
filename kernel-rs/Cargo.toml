[package]
name = "neocad-kernel"
version = "0.1.0"
edition = "2021"
description = "NeoCAD numerical kernel: sparse linear algebra for a general nonlinear least-squares solver. Dimension-agnostic — knows nothing about points, lines, or CAD; just variables and residuals."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
